<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dante Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Dante Visualizer</h1>
    <div class="seg" role="group" aria-label="View">
      <button id="mode-network" aria-pressed="true" title="Each device once, inputs left and outputs right">Network</button>
      <button id="mode-flow" aria-pressed="false" title="Outputs on the left, inputs on the right, every wire flows left to right">Signal flow</button>
    </div>
    <button id="btn-expand" title="Show or hide every channel">Channels</button>
    <button id="btn-layout" title="Rearrange the blocks automatically">Auto layout</button>
    <button id="btn-fit" title="Zoom to fit">Fit</button>
    <label class="file-btn" title="Open a Dante Controller preset">Open preset…<input id="file" type="file" accept=".xml,application/xml,text/xml"></label>
    <span id="status" class="status"></span>
  </header>
  <main>
    <svg id="canvas" aria-label="Dante network diagram">
      <rect id="bg" width="100%" height="100%"></rect>
      <g id="viewport">
        <g id="wires"></g>
        <g id="labels"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div id="empty" class="empty">
      <p><b>Drop a Dante Controller preset here</b>, or use Open preset.</p>
      <p class="muted">When the server is running on a Mac on the Dante network, the live network appears here automatically.</p>
    </div>
    <aside id="panel" class="panel" hidden></aside>
    <div id="tooltip" class="tooltip" hidden></div>
  </main>
  <footer class="hint">Drag blocks to arrange · click a block to show its channels · drag the background to pan · scroll to zoom</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
